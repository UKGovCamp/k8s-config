apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.engiqueer.net:8200"
      caBundle: ""
      path: "ukgovcamp"
      version: "v2"
      auth:
        appRole:
          roleId: 6ff156a2-7f5a-1046-c776-3be8c66b9c5f
          secretRef:
            name: vault-config
            namespace: external-secrets
            key: secret-id
